name: snippet-matrix-refresh

on:
  workflow_dispatch:
    inputs:
      kb_path:
        description: "knowledge base path (defaults to checked-in fixture corpus)"
        required: false
        default: "lepiter-core/tests/fixtures/corpus"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: refresh matrix
        env:
          KB_PATH: ${{ github.event.inputs.kb_path }}
        run: ./scripts/refresh_snippet_matrix.sh "$KB_PATH"

      - name: upload matrix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snippet-support-matrix
          path: docs/snippet-support-matrix.md
