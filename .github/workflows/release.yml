name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            publish_crates: true
          - os: macos-15
            target: x86_64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: macos-15
            target: aarch64-apple-darwin
            bin_ext: ""
            publish_crates: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            publish_crates: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: true

      - name: build release binary
        run: cargo build --release --target ${{ matrix.target }} -p lepiter-cli

      - name: prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## "version"([[:space:]]|$|-)" { in_section = 1; print; next }
            $0 ~ "^## " && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > "$out"

          if [ ! -s "$out" ]; then
            echo "release notes for version $version not found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: package binaries (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive_base="lepiter-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage_dir="${RUNNER_TEMP}/dist/${archive_base}"
          mkdir -p "${stage_dir}"
          cp "target/${{ matrix.target }}/release/lepiter-cli${{ matrix.bin_ext }}" "${stage_dir}/"
          cp README.md LICENSE "${stage_dir}/"
          tar -czf "${RUNNER_TEMP}/dist/${archive_base}.tar.gz" -C "${RUNNER_TEMP}/dist" "${archive_base}"

      - name: package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveBase = "lepiter-cli-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $distDir = Join-Path $env:RUNNER_TEMP "dist"
          $stageDir = Join-Path $distDir $archiveBase
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lepiter-cli${{ matrix.bin_ext }}" $stageDir
          Copy-Item "README.md" $stageDir
          Copy-Item "LICENSE" $stageDir
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath (Join-Path $distDir "$archiveBase.zip") -Force

      - name: upload packaged binaries artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

      - name: run tests
        if: matrix.publish_crates
        run: cargo test --workspace

      - name: docs
        if: matrix.publish_crates
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: install sbom tools
        if: matrix.publish_crates
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          # pinned: an unpinned bump changed what counts as a component and broke this gate
          tool: cargo-cyclonedx@0.5.9,sbom-diff@0.8.0

      # one invocation covers every workspace member, and names each file after
      # the crate it describes. an --override-filename here would give both
      # members the same name and one would overwrite the other on collection.
      - name: generate sbom
        if: matrix.publish_crates
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --format json \
            --all-features \
            --target all

      - name: collect sbom files
        if: matrix.publish_crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/lepiter-cli-sbom
          # each generated file is named for its crate; tag it and keep that name.
          # the approved baselines under sbom/ are inputs, never collected.
          find "$GITHUB_WORKSPACE" -type f -name '*.cdx.json' \
            -not -path "$GITHUB_WORKSPACE/sbom/*" -print0 |
            while IFS= read -r -d '' f; do
              crate="$(basename "$f" .cdx.json)"
              mv "$f" "/tmp/lepiter-cli-sbom/sbom-${GITHUB_REF_NAME}-${crate}.cdx.json"
            done

      - name: upload sbom
        if: matrix.publish_crates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/lepiter-cli-sbom/sbom-${{ github.ref_name }}-*.cdx.json"
          if-no-files-found: error

      - name: diff against approved sbom
        if: matrix.publish_crates
        shell: bash
        run: |
          set -euo pipefail
          for crate in lepiter-core lepiter-cli; do
            current="/tmp/lepiter-cli-sbom/sbom-${GITHUB_REF_NAME}-${crate}.cdx.json"
            approved="sbom/${crate}.cdx.json"
            if [ ! -f "$current" ]; then
              echo "current sbom missing for ${crate}, skipping diff"
              continue
            fi
            if [ ! -f "$approved" ]; then
              echo "approved sbom missing for ${crate}, skipping diff"
              continue
            fi
            sbom-diff "$approved" "$current" --fail-on added-components
          done

      - name: publish lepiter-core
        if: matrix.publish_crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p lepiter-core --no-verify

      - name: publish lepiter-cli
        if: matrix.publish_crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p lepiter-cli --no-verify

  publish-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## "version"([[:space:]]|$|-)" { in_section = 1; print; next }
            $0 ~ "^## " && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > "$out"
          if [ ! -s "$out" ]; then
            echo "release notes for version $version not found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: download sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: sbom-${{ github.ref_name }}
          path: ${{ runner.temp }}/sbom

      - name: create or update github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/sbom/*.cdx.json
