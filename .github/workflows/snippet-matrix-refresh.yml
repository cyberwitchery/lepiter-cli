name: snippet-matrix-refresh

on:
  workflow_dispatch:
    inputs:
      kb_path:
        description: "knowledge base path (defaults to checked-in fixture corpus)"
        required: false
        default: "lepiter-core/tests/fixtures/corpus"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: refresh matrix
        env:
          KB_PATH: ${{ github.event.inputs.kb_path }}
        run: ./scripts/refresh_snippet_matrix.sh "$KB_PATH"

      - name: upload matrix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snippet-support-matrix
          path: docs/snippet-support-matrix.md
