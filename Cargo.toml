[workspace]
members = ["lepiter-core", "lepiter-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.7.0"
license = "MIT"
repository = "https://github.com/cyberwitchery/lepiter-cli"
homepage = "https://github.com/cyberwitchery/lepiter-cli"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
lepiter-core = { version = "0.7.0", path = "lepiter-core" }
open = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
