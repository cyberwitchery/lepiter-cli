name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-lint

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-docs

      - name: Build docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  snippet-matrix:
    name: Snippet Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-snippet-matrix

      - name: Refresh snippet matrix docs
        run: ./scripts/refresh_snippet_matrix.sh

      - name: Ensure matrix docs are committed
        run: git diff --exit-code -- docs/snippet-support-matrix.md

  tests-and-coverage:
    name: Tests + Coverage (>=75%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-tests-and-coverage

      - name: Run tests
        run: cargo test --workspace

      - name: Coverage (lepiter-core >= 75% lines)
        run: cargo llvm-cov --package lepiter-core --all-features --fail-under-lines 75 --summary-only

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo-deny
        run: cargo deny check

  unsafe-gate:
    name: Unsafe Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: kunobi-ninja/kache-action@v1
        with:
          cache-key-prefix: kache-unsafe-gate

      - name: Install unsafe-budget
        run: cargo install unsafe-budget

      - name: Check unsafe budget
        run: cargo unsafe-budget check --workspace-only

  success:
    name: Success
    if: always()
    needs: [lint, docs, snippet-matrix, tests-and-coverage, deny, unsafe-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
