[workspace]
members = ["lepiter-core", "lepiter-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
lepiter-core = { version = "0.6.0", path = "lepiter-core" }
open = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
thiserror = "2"
unicode-width = "0.2"
walkdir = "2"
